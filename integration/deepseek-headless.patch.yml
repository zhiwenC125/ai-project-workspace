# Reuse the Codex subscription login managed by the local credentials service.
# This file contains no credential values and is safe to commit.
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: openai-codex
    model: gpt-5.6-luna
- id: headless-runner
  inject:
    - headlessStartup
    - codexCatalogReady
- insert:
    - id: codex-catalog-ready
      name: "__CODEX_CATALOG_READY_URL__"
      config:
        provider: openai-codex
        model: gpt-5.6-luna
        timeoutMs: 15000
